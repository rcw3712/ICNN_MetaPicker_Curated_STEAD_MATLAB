[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "seismic-eval-audit"
version = "0.1.2"
description = "Explicit metadata and provenance checks for seismic evaluation"
requires-python = ">=3.10"
license = {text = "MIT"}
[project.scripts]
seismic-eval-audit = "seismic_eval_audit.cli:main"
[tool.setuptools.packages.find]
include = ["seismic_eval_audit*"]
